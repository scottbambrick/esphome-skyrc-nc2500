# Office Battery Charger - reads the SkyRC NC2500 NiMH charger over classic Bluetooth (2026-10-10).
# The charger only speaks old-style Bluetooth serial (SPP), which ESPHome has no built-in support for,
# so the custom component in components/skyrc_nc2500 does it (protocol notes in docs/protocol.md).
# Board: must be an ORIGINAL ESP32 (classic Bluetooth). S2/S3/C3/C6 cannot do this.
# Do not add esp32_ble / bluetooth_proxy to this node: the Bluetooth radio is used in classic-only mode.

esphome:
  name: office-battery-charger
  friendly_name: Office Battery Charger

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: # reuses the API encryption key above

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

external_components:
  - source: github://scottbambrick/esphome-skyrc-nc2500
    components: [skyrc_nc2500]

skyrc_nc2500:
  id: charger
  # The charger (it advertises as skyrcNNNN) is paired to this ESP32. With its address and serial channel known the
  # ESP32 connects straight to it, like a phone reconnecting - no search, so no pairing mode needed.
  # If you ever swap the charger, remove these two lines: the ESP32 then searches by name instead
  # (hold ENTER on the charger until the blue LED lights so it can be found).
  mac_address: "AA:BB:CC:DD:EE:FF"
  channel: 2
  name_match: skyrc        # used only when no mac_address is set
  pin: "1234"              # try "0000" if pairing fails
  poll_interval: 15s
  log_frames: false        # set true to see every Bluetooth message while debugging
  connected:
    name: "Bluetooth Connected"
  slots:
    -
      voltage:
        name: "Slot 1 Voltage"
      current:
        name: "Slot 1 Current"
      capacity:
        name: "Slot 1 Capacity"
      temperature:
        name: "Slot 1 Temperature"
      run_time:
        name: "Slot 1 Run Time"
      resistance:
        name: "Slot 1 Resistance"
      cycles:
        name: "Slot 1 Cycles"
      mode:
        name: "Slot 1 Mode"
      state:
        name: "Slot 1 State"
      summary:
        name: "Slot 1 Summary"
      present:
        name: "Slot 1 Battery"
    - voltage:
        name: "Slot 2 Voltage"
      current:
        name: "Slot 2 Current"
      capacity:
        name: "Slot 2 Capacity"
      temperature:
        name: "Slot 2 Temperature"
      run_time:
        name: "Slot 2 Run Time"
      resistance:
        name: "Slot 2 Resistance"
      cycles:
        name: "Slot 2 Cycles"
      mode:
        name: "Slot 2 Mode"
      state:
        name: "Slot 2 State"
      summary:
        name: "Slot 2 Summary"
      present:
        name: "Slot 2 Battery"
    - voltage:
        name: "Slot 3 Voltage"
      current:
        name: "Slot 3 Current"
      capacity:
        name: "Slot 3 Capacity"
      temperature:
        name: "Slot 3 Temperature"
      run_time:
        name: "Slot 3 Run Time"
      resistance:
        name: "Slot 3 Resistance"
      cycles:
        name: "Slot 3 Cycles"
      mode:
        name: "Slot 3 Mode"
      state:
        name: "Slot 3 State"
      summary:
        name: "Slot 3 Summary"
      present:
        name: "Slot 3 Battery"
    - voltage:
        name: "Slot 4 Voltage"
      current:
        name: "Slot 4 Current"
      capacity:
        name: "Slot 4 Capacity"
      temperature:
        name: "Slot 4 Temperature"
      run_time:
        name: "Slot 4 Run Time"
      resistance:
        name: "Slot 4 Resistance"
      cycles:
        name: "Slot 4 Cycles"
      mode:
        name: "Slot 4 Mode"
      state:
        name: "Slot 4 State"
      summary:
        name: "Slot 4 Summary"
      present:
        name: "Slot 4 Battery"

# The charger accepts one Bluetooth connection at a time, so this lets go of it for the phone app.
switch:
  - platform: template
    name: "Bluetooth Link"
    icon: mdi:bluetooth-connect
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(charger).set_enabled(true);
    turn_off_action:
      - lambda: id(charger).set_enabled(false);

# Settings for each slot. Changing these only stages them; pressing "Slot N Apply Settings" sends them to the
# charger and starts that mode on the slot (the same as the "Send" button in the SkyRC app).
#   Charge:    charge current                      Refresh:  charge + discharge current
#   Break-In:  rated capacity                      Discharge: discharge current
#   Cycle:     charge + discharge current + cycles
# Limits are the charger's own: charge 0.2-2.5 A, discharge 0.1-1.0 A, capacity 500-3500 mAh, cycles 1-12.
# "Slot N Stop" ends the slot's program (the app has no stop command; see docs/protocol.md).
select:
  - platform: template
    id: slot1_set_mode
    name: "Slot 1 Setting Mode"
    icon: mdi:cog
    optimistic: true
    restore_value: true
    initial_option: Charge
    options: [Charge, Refresh, Break-In, Discharge, Cycle]
  - platform: template
    id: slot2_set_mode
    name: "Slot 2 Setting Mode"
    icon: mdi:cog
    optimistic: true
    restore_value: true
    initial_option: Charge
    options: [Charge, Refresh, Break-In, Discharge, Cycle]
  - platform: template
    id: slot3_set_mode
    name: "Slot 3 Setting Mode"
    icon: mdi:cog
    optimistic: true
    restore_value: true
    initial_option: Charge
    options: [Charge, Refresh, Break-In, Discharge, Cycle]
  - platform: template
    id: slot4_set_mode
    name: "Slot 4 Setting Mode"
    icon: mdi:cog
    optimistic: true
    restore_value: true
    initial_option: Charge
    options: [Charge, Refresh, Break-In, Discharge, Cycle]

number:
  - platform: template
    id: slot1_set_charge
    name: "Slot 1 Setting Charge Current"
    icon: mdi:battery-arrow-up
    optimistic: true
    restore_value: true
    initial_value: 0.5
    min_value: 0.2
    max_value: 2.5
    step: 0.1
    unit_of_measurement: A
    mode: box
  - platform: template
    id: slot1_set_discharge
    name: "Slot 1 Setting Discharge Current"
    icon: mdi:battery-arrow-down
    optimistic: true
    restore_value: true
    initial_value: 0.3
    min_value: 0.1
    max_value: 1.0
    step: 0.1
    unit_of_measurement: A
    mode: box
  - platform: template
    id: slot1_set_capacity
    name: "Slot 1 Setting Break-In Capacity"
    icon: mdi:battery-heart-variant
    optimistic: true
    restore_value: true
    initial_value: 2000
    min_value: 500
    max_value: 3500
    step: 100
    unit_of_measurement: mAh
    mode: box
  - platform: template
    id: slot1_set_cycles
    name: "Slot 1 Setting Cycles"
    icon: mdi:counter
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 1
    max_value: 12
    step: 1
    mode: box
  - platform: template
    id: slot2_set_charge
    name: "Slot 2 Setting Charge Current"
    icon: mdi:battery-arrow-up
    optimistic: true
    restore_value: true
    initial_value: 0.5
    min_value: 0.2
    max_value: 2.5
