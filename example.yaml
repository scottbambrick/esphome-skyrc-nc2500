button:
  - platform: template
    name: "Slot 1 Apply Settings"
    icon: mdi:play-circle
    on_press:
      - lambda: |-
          id(charger).apply_slot(0, std::string(id(slot1_set_mode).current_option()),
                                 id(slot1_set_charge).state, id(slot1_set_discharge).state,
                                 id(slot1_set_capacity).state, id(slot1_set_cycles).state);
  - platform: template
    name: "Slot 1 Stop"
    icon: mdi:stop-circle
    on_press:
      - lambda: id(charger).stop_slot(0);
  - platform: template
    name: "Slot 2 Apply Settings"
    icon: mdi:play-circle
    on_press:
      - lambda: |-
          id(charger).apply_slot(1, std::string(id(slot2_set_mode).current_option()),
                                 id(slot2_set_charge).state, id(slot2_set_discharge).state,
                                 id(slot2_set_capacity).state, id(slot2_set_cycles).state);
  - platform: template
    name: "Slot 2 Stop"
    icon: mdi:stop-circle
    on_press:
      - lambda: id(charger).stop_slot(1);
  - platform: template
    name: "Slot 3 Apply Settings"
    icon: mdi:play-circle
    on_press:
      - lambda: |-
          id(charger).apply_slot(2, std::string(id(slot3_set_mode).current_option()),
                                 id(slot3_set_charge).state, id(slot3_set_discharge).state,
                                 id(slot3_set_capacity).state, id(slot3_set_cycles).state);
  - platform: template
    name: "Slot 3 Stop"
    icon: mdi:stop-circle
    on_press:
      - lambda: id(charger).stop_slot(2);
  - platform: template
    name: "Slot 4 Apply Settings"
    icon: mdi:play-circle
    on_press:
      - lambda: |-
          id(charger).apply_slot(3, std::string(id(slot4_set_mode).current_option()),
                                 id(slot4_set_charge).state, id(slot4_set_discharge).state,
                                 id(slot4_set_capacity).state, id(slot4_set_cycles).state);
  - platform: template
