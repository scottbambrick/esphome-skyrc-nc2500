# Optional Home Assistant package for the SkyRC NC2500 node in example.yaml (entity ids assume it is called
# office-battery-charger - adjust to yours): progress % and time left per slot.
#
# The charger reports mAh and run time, not how full the battery is, so these are ESTIMATES that use the mode
# that is running, the slot's settings (battery capacity, charge/discharge current, cycles) and the live current:
#   Charge     target = min(capacity x 1.3, charge current x 5 h): NiMH needs ~30% more in than its rating, and the
#              charger stops at 300 min (the 10 Oct test: three cells ended there at 0.2 A = 1000 mAh).
#              Left = (target - charged mAh) / current.
#   Discharge  capacity / discharge current; left = (capacity - mAh counted) / current.
#   Refresh    charge + discharge + charge, with 1 h rests (observed).
#   Break-In   0.1C for 16 h, rest 1 h, 0.2C discharge (up to 5 h), rest 1 h, 0.1C for 16 h = 34-39 h (observed).
#   Cycle      charge, then N x (discharge, charge), 1 h rest between every step (observed). Charges can end
#              early (delta-V), so the estimate errs long.
#   Refresh / Break-In / Cycle are multi-phase programs. VERIFIED on a live Refresh (11 Oct): the charger's run time
#   RESTARTS AT 0 IN EVERY PHASE (charge 5 h, rest 1 h, discharge, rest 1 h, charge 5 h), and mode/capacity don't say
#   which phase it is in. So sensor.*_program_phase (below) counts phase changes since the program started, and
#   left = the rest of the current phase (planned length - run time) + all later phases. Cycle = charge, then
#   N x (rest, discharge, rest, charge). Done = 100%.
# Only exists while connected with a battery in the slot that is working, resting or done.
# attributes: time_left (long text), time_short (compact), minutes_left (number).

template:
  # Phase counter per slot: 0 = first phase of the running program, +1 on every Charging/Resting/Discharging change.
  # Resets when the slot starts from idle/done; a gap where the slot is unavailable (ESP or charger off) keeps it.
  - triggers:
      - trigger: state
        entity_id: sensor.office_battery_charger_slot_1_state
    sensor:
      - name: "Office Battery Charger Slot 1 Program Phase"
        unique_id: office_battery_charger_slot_1_program_phase
        state: >-
          {% set act = ['Charging', 'Resting', 'Discharging'] %}
          {% set to = trigger.to_state.state %}
          {% set fr = trigger.from_state.state if trigger.from_state else 'unknown' %}
          {% if to in act and fr in act %}{{ (this.state | int(0)) + (1 if to != fr else 0) }}
          {% elif to in act and fr in ['unavailable', 'unknown'] %}{{ this.state | int(0) }}
          {% elif to in act %}0
          {% else %}{{ this.state | int(0) if to in ['unavailable', 'unknown'] else 0 }}{% endif %}
  - triggers:
      - trigger: state
        entity_id: sensor.office_battery_charger_slot_2_state
    sensor:
      - name: "Office Battery Charger Slot 2 Program Phase"
        unique_id: office_battery_charger_slot_2_program_phase
        state: >-
          {% set act = ['Charging', 'Resting', 'Discharging'] %}
          {% set to = trigger.to_state.state %}
          {% set fr = trigger.from_state.state if trigger.from_state else 'unknown' %}
          {% if to in act and fr in act %}{{ (this.state | int(0)) + (1 if to != fr else 0) }}
          {% elif to in act and fr in ['unavailable', 'unknown'] %}{{ this.state | int(0) }}
          {% elif to in act %}0
          {% else %}{{ this.state | int(0) if to in ['unavailable', 'unknown'] else 0 }}{% endif %}
  - triggers:
      - trigger: state
        entity_id: sensor.office_battery_charger_slot_3_state
    sensor:
      - name: "Office Battery Charger Slot 3 Program Phase"
        unique_id: office_battery_charger_slot_3_program_phase
        state: >-
          {% set act = ['Charging', 'Resting', 'Discharging'] %}
          {% set to = trigger.to_state.state %}
          {% set fr = trigger.from_state.state if trigger.from_state else 'unknown' %}
          {% if to in act and fr in act %}{{ (this.state | int(0)) + (1 if to != fr else 0) }}
          {% elif to in act and fr in ['unavailable', 'unknown'] %}{{ this.state | int(0) }}
          {% elif to in act %}0
          {% else %}{{ this.state | int(0) if to in ['unavailable', 'unknown'] else 0 }}{% endif %}
  - triggers:
      - trigger: state
        entity_id: sensor.office_battery_charger_slot_4_state
    sensor:
      - name: "Office Battery Charger Slot 4 Program Phase"
        unique_id: office_battery_charger_slot_4_program_phase
        state: >-
          {% set act = ['Charging', 'Resting', 'Discharging'] %}
          {% set to = trigger.to_state.state %}
          {% set fr = trigger.from_state.state if trigger.from_state else 'unknown' %}
          {% if to in act and fr in act %}{{ (this.state | int(0)) + (1 if to != fr else 0) }}
          {% elif to in act and fr in ['unavailable', 'unknown'] %}{{ this.state | int(0) }}
          {% elif to in act %}0
          {% else %}{{ this.state | int(0) if to in ['unavailable', 'unknown'] else 0 }}{% endif %}
  - sensor:
      - name: "Office Battery Charger Slot 1 Charge"
        unique_id: office_battery_charger_slot_1_charge
        icon: mdi:battery-charging
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ is_state('binary_sensor.office_battery_charger_bluetooth_connected', 'on')
             and is_state('binary_sensor.office_battery_charger_slot_1_battery', 'on')
             and states('sensor.office_battery_charger_slot_1_state') in ['Charging', 'Discharging', 'Resting', 'Done'] }}
        state: >-
          {% if is_state('sensor.office_battery_charger_slot_1_state', 'Done') %}100{% else %}
          {% set p = 'office_battery_charger_slot_1' %}
          {% set mode = states('sensor.' ~ p ~ '_mode') %}
          {% set st = states('sensor.' ~ p ~ '_state') %}
          {% set rated = states('number.' ~ p ~ '_setting_break_in_capacity') | float(2000) %}
          {% set cur = states('sensor.' ~ p ~ '_current') | float(0) | abs * 1000 %}
          {% set ic = cur if st == 'Charging' and cur >= 50 else states('number.' ~ p ~ '_setting_charge_current') | float(0.5) * 1000 %}
          {% set idc = cur if st == 'Discharging' and cur >= 50 else states('number.' ~ p ~ '_setting_discharge_current') | float(0.3) * 1000 %}
          {% set cyc = states('number.' ~ p ~ '_setting_cycles') | float(1) | int %}
          {% set mah = states('sensor.' ~ p ~ '_capacity') | float(0) %}
          {% set run = states('sensor.' ~ p ~ '_run_time') | float(0) %}
          {% set tc = [rated * 1.3 / ic * 60, 300] | min %}
          {% set td = rated / idc * 60 %}
          {% set k = states('sensor.' ~ p ~ '_program_phase') | int(0) %}
          {% set ph = {'Refresh': [tc, 60, td, 60, tc], 'Break-In': [960, 60, 300, 60, 960], 'Cycle': [tc] + [60, td, 60, tc] * cyc}.get(mode, []) %}
          {% set total = ph | sum %}
          {% set tgt = [rated * 1.3, ic * 5] | min %}
          {% set simple = mode not in ['Refresh', 'Break-In', 'Discharge', 'Cycle'] %}
          {% set left = ((tgt - mah) / ic * 60 if simple else (rated - mah) / idc * 60 if mode == 'Discharge' else (ph[k:] | sum) - run) %}
          {% set left = [left | round(0) | int, 0] | max %}
          {% set frac = (mah / tgt if simple else mah / rated if mode == 'Discharge' else ((total - left) / total if total > 0 else 0)) %}
          {{ [(frac * 100) | round(0) | int, 99] | min }}{% endif %}
        attributes:
          minutes_left: >-
            {% if is_state('sensor.office_battery_charger_slot_1_state', 'Done') %}0{% else %}
            {% set p = 'office_battery_charger_slot_1' %}
            {% set mode = states('sensor.' ~ p ~ '_mode') %}
            {% set st = states('sensor.' ~ p ~ '_state') %}
            {% set rated = states('number.' ~ p ~ '_setting_break_in_capacity') | float(2000) %}
            {% set cur = states('sensor.' ~ p ~ '_current') | float(0) | abs * 1000 %}
            {% set ic = cur if st == 'Charging' and cur >= 50 else states('number.' ~ p ~ '_setting_charge_current') | float(0.5) * 1000 %}
            {% set idc = cur if st == 'Discharging' and cur >= 50 else states('number.' ~ p ~ '_setting_discharge_current') | float(0.3) * 1000 %}
            {% set cyc = states('number.' ~ p ~ '_setting_cycles') | float(1) | int %}
            {% set mah = states('sensor.' ~ p ~ '_capacity') | float(0) %}
            {% set run = states('sensor.' ~ p ~ '_run_time') | float(0) %}
